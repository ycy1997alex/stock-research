[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "stock-research — 台美權值股的本機評分管線（私人使用）"
requires-python = ">=3.13"
# 依賴 market-barometer 的管線核心：pip install -e ../market-barometer
dependencies = ["barometer"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../market-barometer/src"]
